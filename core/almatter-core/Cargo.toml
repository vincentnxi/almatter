[package]
name = "almatter-core"
version = "0.12.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"

[dev-dependencies]
wiremock = "0.6"
