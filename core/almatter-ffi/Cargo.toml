[package]
name = "almatter-ffi"
version = "0.1.0"
edition = "2021"

# Compiles to almatter_ffi.dll — the .NET side's DllImport name and the
# csproj copy path both point at that filename.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
almatter-core = { path = "../almatter-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
