# Builds Almatter-Setup-<version>.exe on GitHub's own Windows machines, with
# the same installer\build-installer.ps1 used locally, and keeps the result
# as a downloadable artifact of the run.
#
# Why build here rather than on a personal PC: code signing through the
# SignPath Foundation (free for open-source projects) only signs files it can
# trace back to a build of the public source on GitHub. A signed installer is
# far less likely to be deleted by an antivirus mid-install (seen with 0.7.0).
# The signing steps will slot in around the "Build the installer" step once
# SignPath has accepted the project.
#
# Runs when a version tag (v0.8.0, ...) is pushed, or by hand from the
# Actions tab ("Run workflow").

name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    # Reading the code, plus what signing the provenance attestation below
    # needs: an OIDC token for Sigstore's certificate, and the right to
    # store the attestation and its record. Still nothing that can push.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh

    steps:
      # Third-party actions are pinned to a commit rather than a tag: a tag
      # can be moved to different code, a commit cannot.
      # persist-credentials: false — nothing here pushes, so the workflow's
      # token has no reason to stay in .git/config for every later step
      # (the build scripts included) to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag that disagrees with <Version> in the csproj would publish an
      # installer whose name and "About" say something else than the release.
      # The tag name comes in through the environment rather than written
      # into the script: a ${{ }} expression is pasted into the code before
      # PowerShell runs it, so a tag name holding a quote would become code.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content app\Almatter.App\Almatter.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match <Version>$version</Version> in Almatter.App.csproj"
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # No build cache here, on purpose. This job makes the installer that
      # gets published (and, later, signed); a cache is compiled code from
      # an earlier run, and whatever had managed to write a poisoned one
      # would have it built into the release. A slower build of an installer
      # made a few times a month is the cheaper side of that trade.

      # The newest Inno Setup 6 release, so its fixes reach the installer
      # without a manual bump. Version 7 or later is not taken on its own:
      # a new major version can change how Almatter.iss is read, so moving
      # to it is a deliberate change, tested by hand.
      # A download is only run once it matches the SHA-256 GitHub recorded
      # for the release file and carries a valid signature from Inno Setup's
      # publisher, Pyrsys B.V. — a tampered download stops the build.
      - name: Install Inno Setup 6 (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = (Invoke-RestMethod 'https://api.github.com/repos/jrsoftware/issrc/releases?per_page=100' -Headers $headers) |
            Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^is-6_\d+_\d+$' } |
            Sort-Object { [version]($_.tag_name -replace '^is-', '' -replace '_', '.') } -Descending |
            Select-Object -First 1
          if (-not $release) { throw 'No Inno Setup 6 release found' }
          $innoVersion = $release.tag_name -replace '^is-', '' -replace '_', '.'
          $asset = $release.assets | Where-Object { $_.name -eq "innosetup-$innoVersion.exe" } | Select-Object -First 1
          if (-not $asset) { throw "Release $($release.tag_name) has no innosetup-$innoVersion.exe" }
          if ($asset.digest -notmatch '^sha256:([0-9a-f]{64})$') { throw "No SHA-256 recorded for $($asset.name)" }
          $expected = $Matches[1]
          Write-Host "Inno Setup $innoVersion"
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $asset.browser_download_url -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $expected) { throw "Inno Setup download has SHA-256 $hash, GitHub lists $expected" }
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|, )O=Pyrsys B\.V\.(,|$)') {
            throw "Inno Setup download is not validly signed by Pyrsys B.V. ($($signature.Status), $($signature.SignerCertificate.Subject))"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
          # First on PATH, so build-installer.ps1 picks this copy over any
          # other version the runner image might carry.
          $dir | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the installer
        run: .\installer\build-installer.ps1

      # A signed, public statement that this exact installer was built here,
      # from this commit of the public source, by this workflow. Anyone can
      # check a downloaded copy with
      #   gh attestation verify Almatter-Setup-<version>.exe --repo vincentnxi/almatter
      # It only covers an installer uploaded to a release as it came out of
      # this run (the artifact below), not one built elsewhere.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: installer/output/Almatter-Setup-*.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Almatter-Setup
          path: installer/output/Almatter-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
